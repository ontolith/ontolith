name: Security

on:
  pull_request:
    branches: [main]
  schedule:
    # Weekly, independent of PR activity — catches newly-disclosed CVEs in
    # already-merged dependencies (Implementation Plan §7.1).
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  # pip-audit, bandit, and SBOM generation share one checkout + `uv sync`
  # instead of three, to cut per-PR Actions-minute usage on this repo's
  # private-repo minute allotment (this workflow otherwise roughly doubles
  # security.yml's total runner time for no benefit — none of the three
  # steps depend on each other's output, they're just sharing setup cost).
  scan:
    name: Dependency + static security scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run pip-audit
        run: uv run pip-audit

      # `if: always()` below: these three steps are otherwise independent of
      # pip-audit's outcome, but without it a pip-audit failure silently
      # skips bandit/SBOM for the rest of the job (a real incident — a
      # newly-disclosed transitive-dependency CVE masked two genuine bandit
      # findings for a full PR before anyone noticed bandit hadn't actually
      # run). The job still fails overall if any step fails; this only
      # ensures every step gets a chance to report its own result.
      - name: Run bandit
        if: always()
        run: uv run bandit -r src/ontolith -c pyproject.toml

      - name: Generate SBOM
        if: always()
        run: uv run cyclonedx-py environment --pyproject pyproject.toml -o sbom.json

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.json

  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # The gitleaks-action wrapper (gitleaks/gitleaks-action@v3) gates
      # organization accounts behind a paid GITLEAKS_LICENSE — it did the
      # day this repo moved from a personal account to the ontolith org, and
      # this job broke as a result. The underlying gitleaks CLI itself stays
      # free regardless of account type; only the Action wrapper monetizes
      # org usage. Run the CLI directly instead of reintroducing that
      # dependency. (The org also now has GitHub's own free secret scanning
      # + push protection enabled at the repo level as a second layer; this
      # job stays for PR-time, full-history scanning equivalent to before.)
      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks.tar.gz

      - name: Run gitleaks
        run: gitleaks detect --source . --redact -v --exit-code 1
