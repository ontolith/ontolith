version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    # Keep the upper bounds in pyproject.toml (KI-065/KI-070): never widen them
    # on a bump; a major jump is a deliberate, reviewed change.
    versioning-strategy: lockfile-only
    ignore:
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
    groups:
      python-deps:
        patterns: ["*"]
