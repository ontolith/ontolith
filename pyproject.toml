[project]
name = "ontolith"
version = "1.0.0"
description = "A Python framework for collaborative knowledge bases where humans and AI agents are co-equal authors"
authors = [{ name = "Matheus B. Vicari", email = "matheus.boni.vicari@gmail.com" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["knowledge-graph", "ontology", "ai", "collaboration", "governance"]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: Apache Software License",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Topic :: Software Development :: Libraries :: Python Modules",
	"Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
	# <3.0/<1.0/<4.0: KI-070 extends KI-065's <N.0 upper-bound convention
	# (established for mcp, ADR-0026) past the two packages KI-065 itself
	# covered - pydantic in particular underlies every domain model, a
	# higher blast radius than either of those two. typer/python-ulid are
	# lower-risk (CLI-only, ID generation) but bounded too for the same
	# "downstream pip install resolves an unreviewed major, unbounded"
	# reason, not because either has shown 0.x/minor-version breakage the
	# way strawberry-graphql did (KI-065's own floor-bump evidence).
	"pydantic>=2.0,<3.0",
	"typer>=0.9,<1.0",
	"python-ulid>=2.0,<5.0", # floor left at 2.0 (locked resolves 3.x) - <4.0 spans both majors deliberately
	# Required, not optional (SPEC §12.1 MUST): the default SQLite backend
	# uses sqlite-vec for embeddings (ADR-0020).
	"sqlite-vec==0.1.9", # pinned: pre-v1, breaking changes possible (bumped for PYSEC-2026-1938)
	# Linux-only (sys_platform marker, not an optional-dependencies extra):
	# ADR-0051's OS-level plugin sandbox enforcement needs this wherever it
	# can actually work, without an operator having to remember an extra to
	# get the deny-by-default posture register(isolate=True) already
	# defaults to. Needs libseccomp installed on the host (a system
	# library, not something pip provides) - degrades to "not enforced,
	# loudly said so" if it isn't (plugins/sandbox/enforcement.py), never a
	# hard install failure on a Linux host missing it either. Exact-pinned,
	# not a range - it's the entire security boundary for network/
	# filesystem denial (a thin, infrequently-updated ctypes shim over
	# libseccomp), the same reasoning sqlite-vec's own exact pin above
	# already applies (security review finding: a >=/<1.0 range would
	# auto-accept any future 0.x release sight unseen for a package this
	# security-critical).
	"pyseccomp==0.1.2; sys_platform == 'linux'",
]

[project.optional-dependencies]
store-duckdb = ["duckdb>=1.0,<2.0"] # <2.0: KI-070, mirrors mcp's upper-bound convention
rest = [
	# <1.0: KI-070 - fastapi sits on the same auth-bearing request path
	# strawberry-graphql's own <1.0 bound (KI-065) was justified by; uvicorn
	# is its ASGI server, same reasoning. Both are long-lived pre-1.0
	# packages (like strawberry-graphql was before KI-065's own floor bump),
	# so this guards against an eventual major release, not 0.x churn -
	# security.yml's weekly pip-audit remains the real backstop for that.
	"fastapi>=0.110,<1.0",
	"uvicorn>=0.27,<1.0",
]
graphql = [
	# >=0.316: create_graphql_app's extensions=[lambda: QueryDepthLimiter(...), ...]
	# factory-callable pattern (KI-056) raises TypeError at request time on
	# strawberry-graphql<=0.313 (verified against real releases); the >=0.219
	# floor predates that pattern and was never re-verified against it.
	# <1.0: mirrors mcp's own upper-bound convention below (KI-065) - this
	# package sits directly on the auth-bearing request path. Note the
	# floor bump above is itself evidence a *minor* 0.x release already
	# broke this integration once; <1.0 only guards against the next major,
	# not the next 0.x drift - security.yml's weekly pip-audit/scheduled
	# scan is the real backstop for that, same as any other dependency.
	"strawberry-graphql[fastapi]>=0.316,<1.0",
	"uvicorn>=0.27,<1.0", # <1.0: KI-070, same reasoning as rest's own uvicorn bound above
]
mcp = [
    "mcp>=1.28.1,<3.0", # >=1.28.1 fixes PYSEC-2026-3483; <2.0 avoids an unreviewed major bump
]
interop = [
	"pyyaml>=6.0,<7.0", # <7.0: KI-070, mirrors mcp's upper-bound convention
	"rdflib>=7.0,<8.0", # <8.0: KI-065, mirrors mcp's upper-bound convention
]
all = ["ontolith[rest,graphql,mcp,interop,store-duckdb]"]
dev = [
	"ontolith[all]",
	# Testing
	"pytest>=8.0",
	"pytest-cov>=4.1",
	"pytest-asyncio>=0.23",
	"pytest-benchmark>=4.0",
	"httpx>=0.27",
	# starlette>=1.0's TestClient prefers httpx2 (httpx is a deprecated
	# fallback, warns on every request) — both are needed: httpx2 for a
	# warning-free TestClient, httpx as the mcp package's own dependency.
	"httpx2>=2.0",
	"hypothesis>=6.98",
	# Quality
	"ruff>=0.2",
	"mypy>=1.8",
	"types-PyYAML>=6.0",
	"import-linter>=2.0",
	"interrogate>=1.5",
	# griffe's CLI ships as a separate distribution from the `griffe` library
	# itself (KI-020) — used for the public-API-surface diff gate (ci.yml).
	"griffecli>=2.0",
	# Security
	"bandit>=1.7",
	"pip-audit>=2.7",
	# SBOM generation for security.yml (Implementation Plan §7.1).
	"cyclonedx-bom>=7.3.1",
	# Documentation
	"mkdocs-material>=9.7.7",  # CVE-2026-73295 (KI-087), fixed in 9.7.7
	"mkdocstrings[python]>=0.24",
	# Tools
	"pre-commit>=3.6",
]

[project.urls]
Homepage = "https://github.com/ontolith/ontolith"
Documentation = "https://ontolith.github.io/ontolith/"
Repository = "https://github.com/ontolith/ontolith"
Issues = "https://github.com/ontolith/ontolith/issues"

[project.scripts]
ontolith = "ontolith.interfaces.cli:app"

[project.entry-points."ontolith.plugins"]
# Plugin discovery via entry points
# Third-party plugins register here
csv-importer = "ontolith.plugins.reference.csv_importer:CsvImporter"
json-exporter = "ontolith.plugins.reference.json_exporter:JsonExporter"
required-fields-validator = "ontolith.plugins.reference.required_fields_validator:RequiredFieldsValidator"
rdf-owl-exporter = "ontolith.plugins.reference.rdf_exporter:RdfExporter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontolith"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "conformance"]

[tool.ruff.lint]
select = [
	"E",  # pycodestyle errors
	"W",  # pycodestyle warnings
	"F",  # pyflakes
	"I",  # isort
	"B",  # flake8-bugbear
	"C4", # flake8-comprehensions
	"UP", # pyupgrade
]
ignore = [
	"E501", # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # unused imports ok in __init__
# B008 flags `Depends(...)` in argument defaults — that call-in-default is
# FastAPI's own required dependency-injection idiom, not a bug.
"src/ontolith/interfaces/rest.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "sqlite_vec"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Linux-only (pyproject.toml's sys_platform marker) and unstubbed - mypy
# runs on every platform in CI (ADR-0051's own plugin sandbox enforcement),
# so this can't rely on the package actually being installed/importable
# wherever mypy happens to run.
module = "pyseccomp"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "conformance"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--strict-markers", "--strict-config", "--benchmark-skip"]
markers = [
	"slow: marks tests as slow (deselect with '-m \"not slow\"')",
	"integration: marks tests as integration tests",
	"benchmark: marks tests as benchmarks",
]

# Hypothesis profiles (dev/ci/nightly) are registered in the root conftest.py —
# Hypothesis has no native pyproject.toml support, so they can't live here.

[tool.coverage.run]
source = ["src/ontolith"]
branch = true
omit = ["*/tests/*", "*/conformance/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
	"pragma: no cover",
	"def __repr__",
	"raise AssertionError",
	"raise NotImplementedError",
	"if __name__ == .__main__.:",
	"if TYPE_CHECKING:",
	"class .*\\bProtocol\\):",
	"@(abc\\.)?abstractmethod",
]

[tool.coverage.paths]
source = ["src/ontolith"]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = true
ignore-setters = false
fail-under = 95
exclude = ["tests", "conformance", "docs"]
verbose = 2
quiet = false
color = true

[tool.bandit]
# B101 (assert_used) fires on every `assert` in the codebase, including
# internal invariant checks (e.g. `assert accepted is not None` after a
# just-written row is re-fetched) that carry no security meaning — low
# severity, already below the "no unsuppressed mediums+" gate threshold
# (Implementation Plan §5), skipped here purely to keep the report
# signal-only. Genuine B608 (SQL-injection-shaped) findings are suppressed
# individually with `# nosec B608` plus a comment at each site, not here.
skips = ["B101"]

[tool.importlinter]
root_packages = ["ontolith"]

[[tool.importlinter.contracts]]
name = "Dependency Rule: Domain must not import adapters"
type = "forbidden"
source_modules = [
	"ontolith.core",
	"ontolith.schema",
	"ontolith.govern",
	"ontolith.query",
	"ontolith.identity",
]
forbidden_modules = [
	"ontolith.store.sqlite",
	"ontolith.store.duckdb",
	"ontolith.interfaces",
	# ADR-0044 (SPEC §18 observability, M4): swappable ObservabilitySink
	# adapters (e.g. an OpenTelemetry-backed one) will live here — the
	# package is still empty, this entry is forward-looking, ahead of any
	# such adapter actually landing. Domain code depends only on the
	# abstract port in core.observability (the stdlib-backed default and
	# the test-double sink live there too, not here — see ADR-0044's
	# Update section for why).
	"ontolith.observe",
]

# NOTE: The "layers" contract is disabled because store.base (the StorageBackend
# protocol) needs to import Entity/Assertion from core to type its methods.
# This creates an acceptable bidirectional dependency between core and store.base:
#   - core uses StorageBackend protocol to define persistence interface
#   - store.base imports Entity/Assertion to type the protocol methods
# This is acceptable because store.base is an abstract protocol, NOT a concrete
# adapter. The "forbidden" contract above still prevents domain logic from
# importing concrete adapters like ontolith.store.sqlite.
#
# [[tool.importlinter.contracts]]
# name = "Domain layers may only import abstract ports"
# type = "layers"
# layers = [...]  # Disabled - see note above
